name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.commits.*.message, ' '), '[apk]') ||
      contains(join(github.event.commits.*.message, ' '), '[ambos]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run build:apk
      - name: Scan mobile client for server secrets
        run: node scripts/check-mobile-secrets.mjs dist/mobile/client
      - name: Build debug APK
        working-directory: android
        run: bash gradlew assembleDebug
      - name: Scan final APK contents for server secrets
        run: |
          apk_contents="$(mktemp -d)"
          trap 'rm -rf "$apk_contents"' EXIT
          unzip -q android/app/build/outputs/apk/debug/app-debug.apk -d "$apk_contents"
          node scripts/check-mobile-secrets.mjs "$apk_contents"
      - uses: actions/upload-artifact@v4
        with:
          name: grimorio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
